description: AgRV2K USB0 device controller (FSL/ChipIdea-like, FS only, device mode).

compatible: "agm,agrv2k-usb0"

include: usb-ep.yaml

bus: usb

properties:
  reg:
    required: true

  interrupts:
    required: true

  agm,ahb-clkenable-bit:
    type: int
    required: true
    description: |
      Bit index in SYS.AHB_CLKENABLE (0x03000000 + 0x70) gating USB0's AHB
      clock. USB0 is bit 1; the neighbouring bits belong to other peripherals
      (DMAC0 = 0, CRC0 = 2, MAC0 = 3), so a value other than 1 would gate the
      wrong block.
    enum: [1]

  agm,ahb-reset-bit:
    type: int
    required: true
    description: |
      Bit index in SYS.AHB_RESET (0x03000000 + 0x50) holding USB0 in reset;
      write 1 = assert, so bring-up clears it (bit 1, same index as the gate).
    enum: [1]
