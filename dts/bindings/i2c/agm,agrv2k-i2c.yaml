description: |
  AGM AgRV2K I2C controller. Register map is the OpenCores I2C
  master core (PRERLO/PRERHI/CTR/TXR/RXR/CR/SR).

  The SCL/SDA pins are open-drain and their direction belongs to the I2C IP,
  so the pinctrl state that routes them (pinctrl-0) uses AGM_PINCTRL_NO_DIR
  cells: AFSEL is set, DIR is left alone. See
  dts/bindings/pinctrl/agm,agrv2k-pinctrl.yaml.

compatible: "agm,agrv2k-i2c"

include: [i2c-controller.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  clock-frequency:
    default: 100000

  agm,apb-clkenable-bit:
    type: int
    required: true
    description: |
      Bit index in SYS.APB_CLKENABLE (0x03000000 + 0x60) that gates this I2C
      instance's APB clock: 27 for I2C0, 28 for I2C1 (SDK APB_MASK_I2C0/1).
      SoC bring-up opens it, along with the bank gate of the SCL/SDA pins
      named by pinctrl-0.

  clocks:
    required: true
    description: |
      SYSCLK feed for this block. PBUS_DIVIDER resets to 0, so pclk == SYSCLK:
      reference the board's clk0 fixed-clock instead of copying the number --
      the driver reads it with DT_INST_PROP_BY_PHANDLE(n, clocks,
      clock_frequency), exactly like the UART and CAN drivers. A board that
      changes SYSCLK only edits &clk0.
