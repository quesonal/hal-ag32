#
# agrv2k-minimal.cfg — AgRV2K target for OpenOCD *without* the AgRV SDK.
#
# The SDK's platforms/AgRV/etc/agrv2k.cfg carries three things: the target
# itself, the vendor `agrv` flash driver, and a pile of helper procs
# (check_device_id, check_logic, agrv options_*, rtt_*). Only the first is
# needed to examine the SoC, halt it, read/write registers and memory, or
# reset it — which is what tools/probe_state.sh, openocd_reset_run.sh and
# test_uart_capture.sh actually do.
#
# So this file keeps the target and drops the SDK:
#
#   openocd -f boards/agm/agrv2k/shared/support/agrv2k-minimal.cfg \
#           -c "init" -c "halt" -c "mdw 0x40010010 1" -c "shutdown"
#
# No `-s <sdk>/platforms/AgRV/etc` search path is required, and any OpenOCD
# with RISC-V support can load it (verified with the vendor 0.12 build;
# a stock build is expected to work too).
#
# Flashing is a different matter: writing the on-die FLASH needs the vendor
# `agrv` flash driver (or the UART ROM bootloader), so those tools keep
# using the board's support/openocd.cfg, which sources the SDK cfg.
#
# Environment: AGM_SWD_SPEED=<kHz> (default 10000 — the vendor's own
# PlatformIO flow uses 10 MHz; 15 MHz/14285 kHz is what made AP accesses
# stall on this probe).

set _AGM_SPEED 10000
if { [info exists ADAPTER_SPEED] } {
	set _AGM_SPEED $ADAPTER_SPEED
}
if { [info exists ::env(AGM_SWD_SPEED)] } {
	set _AGM_SPEED $::env(AGM_SWD_SPEED)
}

source [find interface/cmsis-dap.cfg]
cmsis-dap backend usb_bulk
transport select swd
adapter speed $_AGM_SPEED

source [find target/swj-dp.tcl]
# `mmw` -- the read-modify-write the examine-end event below uses to set the
# debug-stop bits -- is a Tcl helper that lives in mem_helper.tcl; the SDK cfg
# sources it, and this one has to as well. Without it the event fails with
# `invalid command name "mmw"`, and that failure propagates out of
# `ocd_process_reset`: `reset run` over this cfg then leaves the target
# running instead of resetting it -- two boot-timing runs in a row produce
# no post-reset output at all, while the SDK-based cfg is fine because it
# sources the same file).
source [find mem_helper.tcl]
swj_newdap agrv2k cpu -irlen 4 -ircapture 0x1 -irmask 0xf
dap create agrv2k.dap -chain-position agrv2k.cpu

target create cpu riscv -endian little -dap agrv2k.dap
cpu configure -work-area-phys 0x20000000 -work-area-size 0x10000
riscv virt2phys_mode off
riscv set_mem_access sysbus progbuf

# Register the flash banks even though this file is about debug sessions: the
# `agrv` driver lives in the OpenOCD binary (not in the SDK files), and its
# probe during `init` is what makes an examine settle: 3/3 with it, 1/3
# without, on this probe.
set _FLASH_SIZE 0x100000
if { [info exists FLASH_SIZE] } {
	set _FLASH_SIZE $FLASH_SIZE
}
flash bank agrv2k.FLASH agrv 0x80000000 $_FLASH_SIZE 0 0 cpu
flash bank agrv2k.ROM   agrv 0x00010000 0x2000       0 0 cpu

# DBG_CNTL |= SYS_DBG_IWDG_STOP | SYS_DBG_STANDBY | SYS_DBG_STOP, so a
# running watchdog cannot reset the chip out from under a debug session.
cpu configure -event examine-end {
	halt
	mmw 0x0300001c 0xf 0
}
cpu configure -event reset-start {
	adapter speed 2000
}
cpu configure -event reset-init {
	adapter speed $_AGM_SPEED
}
