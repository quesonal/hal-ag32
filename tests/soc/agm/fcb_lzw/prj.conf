#
# The bitstream LZW decoder on its own: no SoC, no FCB registers, no board.
# soc/agm/agrv2k/fcb_lzw.c is a pure function (see its header), which is the
# point of the split -- the real path feeds the words to FCB->AUTO from soc.c's
# PRE_KERNEL_1 hook, and nothing about that is testable off-target.

CONFIG_ZTEST=y
CONFIG_CRC=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_ZTEST_STACK_SIZE=4096
