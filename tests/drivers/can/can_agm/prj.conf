#
# native_sim suite for drivers/can/can_agm.c.
#
# CAN_AGRV2K is selected from devicetree (DT_HAS_AGM_AGRV2K_CAN_ENABLED), and
# it pulls in the shared can_sja1000.c state machine. No transceiver node: the
# suite plays the SJA1000 register file itself (src/main.c).
CONFIG_ZTEST=y
CONFIG_CAN=y
CONFIG_PINCTRL=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=4096
