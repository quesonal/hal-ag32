# SPDX-License-Identifier: Apache-2.0
#
# native_sim suite for drivers/ethernet/mdio/mdio_agm.c. No net stack: this
# driver is a plain DEVICE_DT_INST_DEFINE() on the
# MAC's MDIO register and only needs the MDIO class.
#
# The MAC's own node has to stay enabled in the overlay (the MDIO driver reads
# its parent's reg), and ETH_AGM selects the Ethernet L2 -- so the smallest
# possible working net configuration comes along. The suite never touches the
# net stack; that is tests/drivers/ethernet/eth_agm's job.
CONFIG_ZTEST=y
CONFIG_MDIO=y
CONFIG_PINCTRL=y
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_CONFIG_SETTINGS=n
CONFIG_NET_PKT_RX_COUNT=2
CONFIG_NET_PKT_TX_COUNT=2
CONFIG_NET_BUF_RX_COUNT=4
CONFIG_NET_BUF_TX_COUNT=4
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_ZTEST_STACK_SIZE=2048
