# SPDX-License-Identifier: Apache-2.0
#
# native_sim suite for drivers/ethernet/phy/phy_agm_lan8720.c.
#
# The PHY node's parent is the MAC (its MDIO bus), so the same minimal net
# configuration the MDIO suite needs comes along: ETH_AGM selects the Ethernet
# L2, and net_pkt wants a protocol selected.
CONFIG_ZTEST=y
CONFIG_ETH_PHY_DRIVER=y
CONFIG_MDIO=y
CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_CONFIG_SETTINGS=n
CONFIG_NET_PKT_RX_COUNT=2
CONFIG_NET_PKT_TX_COUNT=2
CONFIG_NET_BUF_RX_COUNT=4
CONFIG_NET_BUF_TX_COUNT=4
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=4096
