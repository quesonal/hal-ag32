# SPDX-License-Identifier: Apache-2.0
#
# Two-cell interrupt controller for the native AGM driver suites.
#
# The AgRV2K MAC binding requires `interrupts`, and this suite pends the line
# with posix_sw_set_pending_IRQ() so the real eth_agm_isr() runs. native_sim
# ships no interrupt controller of its own (posix.dtsi is a bare skeleton), so
# the suite declares this one: no driver, just the DT shape the interrupt
# specifier needs, with the same cell names the driver reads
# (DT_INST_IRQ(n, priority)).
#
# "vnd" is the vendor prefix Zephyr reserves for exactly this: "a stand-in for
# a real vendor which can be used in examples and tests"
# (dts/bindings/vendor-prefixes.txt).

description: Fake interrupt controller for native AGM driver tests

compatible: "vnd,fake-intc"

include: [interrupt-controller.yaml, base.yaml]

interrupt-cells:
  - irq
  - priority
