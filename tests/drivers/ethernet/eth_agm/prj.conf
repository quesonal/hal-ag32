#
# native_sim suite for drivers/ethernet/eth_agm.c.
#
# The driver is a NET_DEVICE_DT_INST_DEFINE() citizen, so the suite carries the
# smallest net stack that can carry a frame: L2 Ethernet (selected by ETH_AGM),
# net_pkt pools for both directions, and AF_PACKET sockets so a received frame
# can be read back byte-for-byte. No IP stack: the suite never needs one, and
# leaving IPv4/IPv6 off keeps the RX path from generating its own traffic.
CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_PINCTRL=y

# 100 us ticks. eth_agm_hw_reset() busy-waits at most ~1000 x 1 us for
# CTRL.RESET to self-clear, and the suite's engine model can only play that
# bit from a timer expiry -- at the native_sim default of 100 Hz (10 ms/tick)
# no tick would ever fall inside that window.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000

CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=n
CONFIG_NET_IPV6=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_PACKET=y

# eth_agm.c's stats (CONFIG_NET_STATISTICS_ETHERNET) are what the RX drain
# updates; reading them back is how the suite proves the drain ran.
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_ETHERNET=y

CONFIG_NET_PKT_RX_COUNT=4
CONFIG_NET_PKT_TX_COUNT=4
CONFIG_NET_BUF_RX_COUNT=8
CONFIG_NET_BUF_TX_COUNT=8
CONFIG_NET_BUF_DATA_SIZE=1600
CONFIG_NET_MAX_CONTEXTS=3
CONFIG_HEAP_MEM_POOL_SIZE=8192
