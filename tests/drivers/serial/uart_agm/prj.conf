# SPDX-License-Identifier: Apache-2.0
#
# The driver is on by default once the overlay declares a node for it; the
# interrupt-driven half is what exposes irq_tx_complete()/fifo_fill(), and
# PINCTRL is selected by CONFIG_UART_AGM but the
# fake intc has no driver, so keep the rest minimal.
CONFIG_ZTEST=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_PINCTRL=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=4096
