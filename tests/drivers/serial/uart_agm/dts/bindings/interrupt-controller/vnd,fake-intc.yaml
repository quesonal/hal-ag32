# SPDX-License-Identifier: Apache-2.0
#
# Two-cell interrupt controller for the native AGM driver suites.
#
# The AgRV2K UART binding (like the real part's) requires `interrupts`, and the
# driver's API table only carries the interrupt-driven methods when the node has
# one -- irq_tx_complete() is only reachable that way.
# native_sim ships no interrupt controller of its own (posix.dtsi is bare
# skeleton), so the suite declares this one: no driver, just the DT shape the
# interrupt specifier needs, with the same cell names the drivers read
# (DT_INST_IRQ(n, priority)).
#
# "vnd" is the vendor prefix Zephyr reserves for exactly this: "a stand-in for
# a real vendor which can be used in examples and tests"
# (dts/bindings/vendor-prefixes.txt).

description: Fake interrupt controller for native AGM driver tests

compatible: "vnd,fake-intc"

include: [interrupt-controller.yaml, base.yaml]

interrupt-cells:
  - irq
  - priority
