#
# The bootloader driver in its signed mode, RSA-2048-PSS flavour: images must be
# MCUboot containers signed with the fixture key (see fixtures/README.md).

CONFIG_ZTEST=y

CONFIG_FLASH=y
CONFIG_FLASH_SIMULATOR=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_CRC=y
CONFIG_BOOT_AGM=y
CONFIG_BOOT_AGM_SIG_RSA2048_PSS=y

# No console protocols here; the driver still wants the console device.
CONFIG_BOOT_AGM_ONESHOT=n
CONFIG_BOOT_AGM_AN3155=n
CONFIG_SERIAL=y
# app.overlay points the console at a zephyr,uart-emul (the driver only needs
# *a* console device; this one needs no pty).
CONFIG_EMUL=y
CONFIG_UART_EMUL=y

CONFIG_MAIN_STACK_SIZE=8192
CONFIG_ZTEST_STACK_SIZE=8192

# Note: no MBEDTLS_ENABLE_HEAP here. PSA stores key material in statically
# allocated slots by default (MBEDTLS_PSA_STATIC_KEY_SLOTS), which is what a
# bootloader that imports one 270-byte public key wants -- no heap, no
# allocator in the loader's footprint.
#
# Only two of those slots: the default 16 are sized for the largest enabled
# key type and this driver imports exactly one key, so the rest is ~7.9 KB of
# RAM spent on nothing.
CONFIG_MBEDTLS_PSA_KEY_SLOT_COUNT=2
