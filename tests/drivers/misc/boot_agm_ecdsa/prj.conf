# SPDX-License-Identifier: Apache-2.0
#
# The bootloader driver in its signed mode: images must be MCUboot containers
# signed with the fixture key.

CONFIG_ZTEST=y

CONFIG_FLASH=y
CONFIG_FLASH_SIMULATOR=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_CRC=y
CONFIG_BOOT_AGM=y
CONFIG_BOOT_AGM_SIG_ECDSA_P256=y
# The fabric (bitstream) slots are signed too: same container format, ECDSA
# P-256 whatever the application profile is (the boot path verifies them
# before the kernel's heap exists), see Kconfig.
CONFIG_BOOT_AGM_BITSTREAM_SIGNED=y

# No console protocols here; the driver still wants the console device.
CONFIG_BOOT_AGM_ONESHOT=n
CONFIG_BOOT_AGM_AN3155=n
CONFIG_SERIAL=y
# app.overlay points the console at a zephyr,uart-emul (the driver only needs
# *a* console device; this one needs no pty).
CONFIG_EMUL=y
CONFIG_UART_EMUL=y

CONFIG_MAIN_STACK_SIZE=8192
CONFIG_ZTEST_STACK_SIZE=4096
