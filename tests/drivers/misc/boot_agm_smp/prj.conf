# SPDX-License-Identifier: Apache-2.0
#
# Native (native_sim) test of the loader's SMP (mcumgr) server, including the
# R2b group 0x40. Same stand-in flashes as the api suite (app.overlay), plus
# the mcumgr stack the driver's hand-written group lives in: the transport
# framing (base64 lines behind 0x0609/0x0414) comes from Zephyr's serial
# helpers -- CONFIG_BOOT_AGM_SMP selects them -- and the group itself is the
# driver's.

CONFIG_ZTEST=y

CONFIG_FLASH=y
CONFIG_FLASH_SIMULATOR=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_CRC=y
CONFIG_BOOT_AGM=y

# The mcumgr server (drivers/misc/boot_agm_smp.c). CONFIG_MCUMGR is "depends
# on" ZCBOR/NET_BUF, so both have to be on as well or it is silently forced
# back to n -- the same trap the sample's prj.conf documents.
CONFIG_BOOT_AGM_SMP=y
CONFIG_ZCBOR=y
CONFIG_NET_BUF=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=512
CONFIG_MCUMGR_TRANSPORT_NETBUF_COUNT=4
# The SMP decode state is sized by this (the *min* value is only a floor that
# the stock groups raise by select), and the handlers' zcbor_map_decode_bulk()
# needs one nested-container backup: at the default 0 every request whose
# handler decodes a body comes back EINVAL; the loader sample ends up with 2
# as well, selected there by the stock os group). 2 also covers the nested
# maps an `image state` entry carries.
CONFIG_MCUMGR_SMP_CBOR_MAX_DECODING_LEVELS=2
# The server answers from the mcumgr work queue: it has to preempt the test
# thread, or the reply is still queued when the test looks for it.
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_THREAD_PRIO=-1
# The test frames its own requests, so it needs base64_encode() (the driver
# side gets base64*cde* from the transport helpers).
CONFIG_BASE64=y

# No AN3155 server here: this suite is about the other protocol.
CONFIG_BOOT_AGM_AN3155=n
# The one-shot override pokes RTC backup registers that do not exist on this
# target; `image state` reads through agm_boot_info_get(), which peeks at them.
CONFIG_BOOT_AGM_ONESHOT=n

# The console both the driver and the server write through is zephyr,uart-emul
# (app.overlay); the test reads the replies out of its TX fifo.
CONFIG_EMUL=y
CONFIG_UART_EMUL=y
CONFIG_SERIAL=y
# Nothing else may write to that UART: the log backend defaults to it.
CONFIG_LOG=n

CONFIG_MAIN_STACK_SIZE=8192
CONFIG_ZTEST_STACK_SIZE=4096
