#
# Native (native_sim) test of the bootloader/DFU driver's public API. The two
# flashes are zephyr,sim-flash devices (see app.overlay), so no board, no
# bitstream and no probe are involved.

CONFIG_ZTEST=y

# The driver needs the flash subsystem, CRC32 (the record's integrity check)
# and the devicetree node from app.overlay.
CONFIG_FLASH=y
CONFIG_FLASH_SIMULATOR=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_CRC=y
CONFIG_BOOT_AGM=y

# Per-chip binding is not here: it needs a signature profile (its tag is an
# HMAC over the version and the digest the signature covers), and this suite
# runs BOOT_AGM_SIG_NONE on purpose -- it is the raw-image API suite. The
# binding vectors and the enforcement have their own suite,
# tests/drivers/misc/boot_agm_bind, built on the signed profile.

# The one-shot override pokes RTC backup registers that do not exist on this
# target (and the AN3155 server wants the console UART): both are off here,
# which is exactly what CONFIG_BOOT_AGM_ONESHOT is for.
CONFIG_BOOT_AGM_ONESHOT=n
CONFIG_BOOT_AGM_AN3155=y

# The console both protocol servers talk on is zephyr,uart-emul (app.overlay):
# the tests put bytes into its RX fifo and read what the server wrote.
# (UART_EMUL itself depends on the generic EMUL option.)
CONFIG_EMUL=y
CONFIG_UART_EMUL=y
# UART_EMUL selects SERIAL_HAS_DRIVER, which lives under `if SERIAL`.
CONFIG_SERIAL=y

# The AN3155 test reads the protocol replies out of that same UART, so nothing
# else may write there: the log backend defaults to the console device.
CONFIG_LOG=n

CONFIG_MAIN_STACK_SIZE=8192
CONFIG_ZTEST_STACK_SIZE=4096
