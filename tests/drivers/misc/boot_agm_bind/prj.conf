# SPDX-License-Identifier: Apache-2.0
#
# The bootloader driver in its per-chip binding mode: signed containers, and
# the extra BIND TLV that says which one chip may run them.

CONFIG_ZTEST=y

CONFIG_FLASH=y
CONFIG_FLASH_SIMULATOR=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_CRC=y
CONFIG_BOOT_AGM=y
# Binding sits on top of a signature profile (the tag is an HMAC over the
# version and the digest the signature covers), so the build needs one -- the
# containers below are the ECDSA suite's, signed with the fixture key.
CONFIG_BOOT_AGM_SIG_ECDSA_P256=y
CONFIG_BOOT_AGM_BIND=y

# No console protocols here; the driver still wants the console device.
CONFIG_BOOT_AGM_ONESHOT=n
CONFIG_BOOT_AGM_AN3155=n
CONFIG_SERIAL=y
# app.overlay points the console at a zephyr,uart-emul (the driver only needs
# *a* console device; this one needs no pty).
CONFIG_EMUL=y
CONFIG_UART_EMUL=y

CONFIG_MAIN_STACK_SIZE=8192
CONFIG_ZTEST_STACK_SIZE=4096
