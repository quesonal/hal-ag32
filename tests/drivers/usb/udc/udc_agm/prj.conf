CONFIG_ZTEST=y
# The class symbol is UDC_DRIVER (the module's zephyr/Kconfig gates
# drivers/usb/udc/Kconfig.agm on it), not "UDC" -- CONFIG_UDC=y is not a symbol
# and Kconfig rejects it.
CONFIG_UDC_DRIVER=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=4096
