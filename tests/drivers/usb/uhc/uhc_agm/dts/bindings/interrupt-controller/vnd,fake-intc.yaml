# SPDX-License-Identifier: Apache-2.0
#
# Two-cell interrupt controller for the native AGM driver suites. Same file as
# tests/drivers/usb/udc/udc_agm/dts/bindings/interrupt-controller/ -- Zephyr
# only looks for bindings under <app>/dts, so each suite carries its own copy.
# "vnd" is the vendor prefix reserved for exactly this.

description: Fake interrupt controller for native AGM driver tests

compatible: "vnd,fake-intc"

include: [interrupt-controller.yaml, base.yaml]

interrupt-cells:
  - irq
  - priority
